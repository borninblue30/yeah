
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색</title>

    <style>
        /* 기본 페이지 설정 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #222;
        }

        /* 화면을 왼쪽과 오른쪽으로 분할 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 380px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-right: 1px solid #ddd;
            z-index: 2;
        }

        .header {
            padding: 24px 20px 16px;
        }

        .header h1 {
            margin: 0 0 18px;
            font-size: 24px;
        }

        /* 검색창과 버튼 */
        .search-form {
            display: flex;
            gap: 8px;
        }

        #searchInput {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        #searchInput:focus {
            border-color: #fee500;
        }

        #searchButton {
            padding: 0 16px;
            border: none;
            border-radius: 8px;
            background: #fee500;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        #searchButton:hover {
            background: #f4d900;
        }

        /* 현재 위치 및 안내 메시지 */
        #statusMessage {
            margin-top: 12px;
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        /* 검색 결과 목록 */
        #resultList {
            flex: 1;
            overflow-y: auto;
            border-top: 1px solid #eee;
        }

        .place-item {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .place-item:hover {
            background: #fafafa;
        }

        .place-item h3 {
            margin: 0 0 8px;
            font-size: 16px;
        }

        .place-item p {
            margin: 5px 0;
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .place-category {
            color: #888;
        }

        .empty-message {
            padding: 24px 20px;
            color: #777;
            font-size: 14px;
            line-height: 1.6;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex: 1;
            height: 100%;
            min-width: 0;
            background: #f2f2f2;
        }

        /* 작은 화면에서는 검색창을 위쪽에 배치 */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 45%;
                min-height: 240px;
            }

            .header {
                padding: 14px;
            }

            .header h1 {
                font-size: 20px;
                margin-bottom: 12px;
            }

            #map {
                width: 100%;
                height: 55%;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽: 검색창과 결과 목록 -->
        <aside class="sidebar">
            <div class="header">
                <h1>장소 검색</h1>

                <form class="search-form" id="searchForm">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="장소를 검색하세요"
                        autocomplete="off"
                    >
                    <button type="submit" id="searchButton">
                        검색
                    </button>
                </form>

                <div id="statusMessage" role="status" aria-live="polite">
                    지도를 불러오는 중입니다...
                </div>
            </div>

            <div id="resultList">
                <div class="empty-message">
                    지도가 준비되면 장소를 검색할 수 있습니다.
                </div>
            </div>
        </aside>

        <!-- 오른쪽: 카카오 지도 -->
        <div id="map" aria-label="장소 검색 지도"></div>
    </div>

    <!-- 카카오 지도 SDK: services 라이브러리 포함 -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=[선생님 JS 키]&libraries=services&autoload=false"
        onerror="document.getElementById('statusMessage').textContent = '카카오맵 SDK를 불러오지 못했습니다. 키와 도메인을 확인하세요.'"
    ></script>

    <script>
        // 지도와 검색 기능에 사용할 변수
        let map;
        let placesService;
        let markers = [];
        let infoWindow;
        let currentPosition = null;

        // HTML 요소 가져오기
        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const resultList = document.getElementById("resultList");
        const statusMessage = document.getElementById("statusMessage");

        // SDK가 준비되었는지 확인하고 지도 초기화
        window.addEventListener("load", function () {
            if (typeof kakao === "undefined" || !kakao.maps) {
                statusMessage.textContent =
                    "카카오맵 SDK 로드에 실패했습니다. JavaScript 키와 웹 도메인을 확인하세요.";
                return;
            }

            // 지도 API가 완전히 준비된 뒤 실행
            kakao.maps.load(function () {
                initializeMap();
            });
        });

        // 지도 초기화
        function initializeMap() {
            // 기본 중심 좌표는 서울 시청
            const defaultPosition = new kakao.maps.LatLng(
                37.566826,
                126.9786567
            );

            // 지도 생성: 확대 레벨은 5
            map = new kakao.maps.Map(
                document.getElementById("map"),
                {
                    center: defaultPosition,
                    level: 5
                }
            );

            // 장소 검색 서비스 생성
            placesService = new kakao.maps.services.Places(map);

            // 장소 이름을 보여주는 정보창 생성
            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 3
            });

            statusMessage.textContent =
                "현재 위치를 확인하고 있습니다...";

            // 지도가 만들어진 뒤 현재 위치 확인
            getCurrentLocation();

            // 검색 버튼을 눌렀을 때 실행
            searchForm.addEventListener("submit", function (event) {
                event.preventDefault();
                searchPlaces();
            });
        }

        // 현재 위치 확인
        function getCurrentLocation() {
            // 브라우저가 위치 정보를 지원하는지 확인
            if (!navigator.geolocation) {
                statusMessage.textContent =
                    "이 브라우저에서는 위치 정보를 사용할 수 없습니다.";
                return;
            }

            // 사용자에게 위치 권한 요청
            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 현재 위치의 위도와 경도 저장
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    currentPosition = new kakao.maps.LatLng(
                        latitude,
                        longitude
                    );

                    // 지도의 중심을 현재 위치로 이동
                    map.setCenter(currentPosition);

                    // 현재 위치를 표시할 마커 생성
                    const currentMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition
                    });

                    // 현재 위치 마커의 설명 설정
                    const currentInfoWindow =
                        new kakao.maps.InfoWindow({
                            content:
                                '<div style="padding:8px;font-size:13px;">현재 위치</div>'
                        });

                    currentInfoWindow.open(map, currentMarker);

                    statusMessage.textContent =
                        "현재 위치를 표시했습니다. 장소를 검색해 보세요.";
                },
                function (error) {
                    // 위치 권한 거부 또는 위치 확인 실패 처리
                    if (error.code === error.PERMISSION_DENIED) {
                        statusMessage.textContent =
                            "위치 권한이 거부되었습니다. 서울 시청을 중심으로 표시합니다.";
                    } else {
                        statusMessage.textContent =
                            "현재 위치를 확인할 수 없습니다. 서울 시청을 중심으로 표시합니다.";
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // 검색 결과에 표시된 기존 마커 제거
        function clearMarkers() {
            markers.forEach(function (marker) {
                marker.setMap(null);
            });

            markers = [];
            infoWindow.close();
        }

        // 장소 검색 실행
        function searchPlaces() {
            const keyword = searchInput.value.trim();

            // 검색어가 비어 있는지 확인
            if (keyword === "") {
                statusMessage.textContent =
                    "검색할 장소 이름을 입력해 주세요.";
                searchInput.focus();
                return;
            }

            statusMessage.textContent =
                '"' + keyword + '" 검색 중입니다...';

            searchButton.disabled = true;
            clearMarkers();

            // 키워드로 장소 검색
            placesService.keywordSearch(
                keyword,
                function (data, status, pagination) {
                    searchButton.disabled = false;

                    // 검색 결과가 있는 경우
                    if (status === kakao.maps.services.Status.OK) {
                        displayPlaces(data);

                        statusMessage.textContent =
                            "검색 결과 " + data.length + "개";

                    } else if (
                        status === kakao.maps.services.Status.ZERO_RESULT
                    ) {
                        // 검색 결과가 없는 경우
                        resultList.innerHTML =
                            '<div class="empty-message">검색 결과가 없습니다. 다른 검색어를 입력해 보세요.</div>';

                        statusMessage.textContent =
                            "검색 결과가 없습니다.";

                    } else {
                        // 검색 과정에서 오류가 발생한 경우
                        resultList.innerHTML =
                            '<div class="empty-message">검색 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.</div>';

                        statusMessage.textContent =
                            "검색에 실패했습니다.";
                    }
                },
                {
                    // 현재 지도 중심을 기준으로 검색
                    location: map.getCenter(),
                    sort: kakao.maps.services.SortBy.ACCURACY
                }
            );
        }

        // 검색 결과를 목록과 지도에 표시
        function displayPlaces(places) {
            resultList.innerHTML = "";

            // 검색 결과의 위치를 모두 포함할 지도 범위
            const bounds = new kakao.maps.LatLngBounds();

            places.forEach(function (place, index) {
                const position = new kakao.maps.LatLng(
                    place.y,
                    place.x
                );

                // 장소 마커 생성
                const marker = new kakao.maps.Marker({
                    map: map,
                    position: position
                });

                markers.push(marker);
                bounds.extend(position);

                // 검색 결과 항목 생성
                const item = document.createElement("div");
                item.className = "place-item";

                const title = document.createElement("h3");
                title.textContent = (index + 1) + ". " + place.place_name;

                const category = document.createElement("p");
                category.className = "place-category";
                category.textContent =
                    place.category_name || "분류 정보 없음";

                const address = document.createElement("p");
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";

                const phone = document.createElement("p");
                phone.textContent =
                    place.phone || "전화번호 정보 없음";

                item.appendChild(title);
                item.appendChild(category);
                item.appendChild(address);
                item.appendChild(phone);

                // 결과 항목을 클릭하면 해당 장소로 이동
                item.addEventListener("click", function () {
                    map.setCenter(position);
                    map.setLevel(3);

                    showPlaceInfo(place, marker);
                });

                // 마커를 클릭해도 장소 정보 표시
                kakao.maps.event.addListener(
                    marker,
                    "click",
                    function () {
                        map.setCenter(position);
                        showPlaceInfo(place, marker);
                    }
                );

                resultList.appendChild(item);
            });

            // 검색된 장소들이 모두 보이도록 지도 범위 조정
            if (places.length > 0) {
                map.setBounds(bounds);
            }
        }

        // 선택한 장소의 정보창 표시
        function showPlaceInfo(place, marker) {
            const content = document.createElement("div");
            content.style.cssText =
                "padding:10px;font-size:13px;max-width:220px;";

            const title = document.createElement("strong");
            title.textContent = place.place_name;

            const link = document.createElement("a");
            link.href = place.place_url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "카카오맵에서 보기";
            link.style.cssText =
                "display:block;margin-top:6px;color:#1769aa;";

            content.appendChild(title);
            content.appendChild(link);

            infoWindow.setContent(content);
            infoWindow.open(map, marker);
        }
    </script>
</body>
</html>
